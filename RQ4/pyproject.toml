[project]
name = "agentproxy"
version = "0.1.0"
description = "Transparent LLM agent proxy for detecting unfiltered open-model special tokens"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.1",
    "filelock>=3.29.4",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rich>=13",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
agentproxy = "agentproxy.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
