rules:
  - id: "deepseek-boundary-special"
    name: "DeepSeek boundary special tokens"
    tokens:
      - "<｜begin▁of▁sentence｜>"
      - "<｜end▁of▁sentence｜>"
      - "<|EOT|>"
      - "<｜▁pad▁｜>"
      - "<pad>"
      - "｜DSML｜"
    match_type: contains
    severity: high

  - id: "deepseek-chat-markers"
    name: "DeepSeek chat control markers"
    tokens:
      - "<｜User｜>"
      - "<｜Assistant｜>"
      - "<|User|>"
      - "<|Assistant|>"
    match_type: contains
    severity: high

  - id: "deepseek-fim-markers"
    name: "DeepSeek FIM control markers"
    tokens:
      - "<｜fim▁begin｜>"
      - "<｜fim▁hole｜>"
      - "<｜fim▁end｜>"
      - "<｜completion｜>"
    match_type: contains
    severity: high

  - id: "deepseek-tool-markers"
    name: "DeepSeek tool control markers"
    tokens:
      - "<｜tool▁calls▁begin｜>"
      - "<｜tool▁call▁begin｜>"
      - "<｜tool▁sep｜>"
      - "<｜tool▁call▁end｜>"
      - "<｜tool▁calls▁end｜>"
      - "<｜tool▁outputs▁begin｜>"
      - "<｜tool▁output▁begin｜>"
      - "<｜tool▁output▁end｜>"
      - "<｜tool▁outputs▁end｜>"
      - "<｜DSML｜function_calls>"
      - "</｜DSML｜function_calls>"
      - "<｜DSML｜tool_calls>"
      - "</｜DSML｜tool_calls>"
      - "<｜DSML｜invoke"
      - "</｜DSML｜invoke>"
      - "<｜DSML｜parameter"
      - "</｜DSML｜parameter>"
      - "<function_results>"
      - "</function_results>"
      - "<result>"
      - "</result>"
      - "<tool_result>"
      - "</tool_result>"
    match_type: contains
    severity: high

  - id: "deepseek-thinking-markers"
    name: "DeepSeek reasoning control markers"
    tokens:
      - "<think>"
      - "</think>"
    match_type: contains
    severity: high

  - id: "deepseek-placeholder-special"
    name: "DeepSeek placeholder reserved special tokens"
    tokens:
      - "<｜place▁holder▁no▁\\d+｜>"
    match_type: regex
    severity: medium

  - id: "deepseek-v4-mm-placeholder-special"
    name: "DeepSeek V4 multimodal placeholder special tokens"
    tokens:
      - "<\\|place_holder_mm_span_\\d{4}\\|>"
    match_type: regex
    severity: medium

  - id: "deepseek-v4-vision-special"
    name: "DeepSeek V4 vision and grounding special tokens"
    tokens:
      - "<｜image｜>"
      - "<｜image2｜>"
      - "<｜rl_image_start｜>"
      - "<｜rl_image_pad｜>"
      - "<｜ref｜>"
      - "<｜/ref｜>"
      - "<｜box｜>"
      - "<｜/box｜>"
      - "<｜point｜>"
      - "<｜/point｜>"
      - "<｜polygon｜>"
      - "<｜/polygon｜>"
    match_type: contains
    severity: high

  - id: "deepseek-v4-quick-task-markers"
    name: "DeepSeek V4 quick instruction control markers"
    tokens:
      - "<｜latest_reminder｜>"
      - "<｜action｜>"
      - "<｜query｜>"
      - "<｜authority｜>"
      - "<｜domain｜>"
      - "<｜title｜>"
      - "<｜read_url｜>"
      - "<｜extracted_url｜>"
      - "<｜end_of_query｜>"
      - "<｜begin▁sys｜>"
      - "<｜end▁sys｜>"
      - "<｜task｜>"
      - "<｜answer｜>"
      - "<｜entity｜>"
      - "<｜political｜>"
      - "<｜safety｜>"
      - "<｜search｜>"
      - "<｜search▁begin｜>"
      - "<｜search▁end｜>"
    match_type: contains
    severity: high

  - id: "deepseek-v4-file-table-markers"
    name: "DeepSeek V4 file and table control markers"
    tokens:
      - "<｜begin▁of▁repo▁name｜>"
      - "<｜end▁of▁repo▁name｜>"
      - "<｜begin▁of▁file▁name｜>"
      - "<｜end▁of▁file▁name｜>"
      - "<｜begin▁of▁file｜>"
      - "<｜end▁of▁file｜>"
      - "<｜place▁holder▁for▁copy｜>"
      - "<｜place▁holder▁for▁pointer▁replace｜>"
      - "<｜table｜>"
      - "<｜/table>｜"
      - "<｜tr｜>"
      - "<｜/tr｜>"
      - "<｜td｜>"
      - "<｜/td｜>"
    match_type: contains
    severity: high

  - id: "deepseek-dsml-markup"
    name: "DeepSeek DSML markup"
    tokens:
      - "</?｜DSML｜(?:function_calls|tool_calls|invoke|parameter)\\b[^>]*>"
    match_type: regex
    severity: high

  - id: "deepseek-distill-qwen-special"
    name: "DeepSeek R1 Distill Qwen inherited special tokens"
    tokens:
      - "<|vision_start|>"
      - "<|vision_end|>"
      - "<|vision_pad|>"
      - "<|image_pad|>"
      - "<|video_pad|>"
      - "<|quad_start|>"
      - "<|quad_end|>"
      - "<|fim_prefix|>"
      - "<|fim_middle|>"
      - "<|fim_suffix|>"
      - "<|fim_pad|>"
      - "<|repo_name|>"
      - "<|file_sep|>"
      - "<tool_call>"
      - "</tool_call>"
    match_type: contains
    severity: high

  - id: "deepseek-distill-llama-special"
    name: "DeepSeek R1 Distill Llama inherited special tokens"
    tokens:
      - "<|start_header_id|>"
      - "<|end_header_id|>"
      - "<|eom_id|>"
      - "<|eot_id|>"
      - "<|python_tag|>"
      - "<|finetune_right_pad_id|>"
    match_type: contains
    severity: high

  - id: "deepseek-distill-llama-reserved-special"
    name: "DeepSeek R1 Distill Llama reserved special tokens"
    tokens:
      - "<\\|reserved_special_token_\\d+\\|>"
    match_type: regex
    severity: medium

settings:
  check_request_body: true
  check_request_headers: false
  log_response_body: true
