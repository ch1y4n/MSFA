rules:
  - id: "llama-boundary-special"
    name: "Llama boundary special tokens"
    tokens:
      - "<s>"
      - "</s>"
      - "<unk>"
      - "<|begin_of_text|>"
      - "<|end_of_text|>"
      - "<|finetune_right_pad_id|>"
      - "<|finetune_right_pad|>"
    match_type: contains
    severity: high

  - id: "llama-instruct"
    name: "Llama instruction template markers"
    tokens:
      - "[INST]"
      - "[/INST]"
      - "<<SYS>>"
      - "<</SYS>>"
    match_type: contains
    severity: high

  - id: "llama3-chat-special"
    name: "Llama 3 chat special tokens"
    tokens:
      - "<|start_header_id|>"
      - "<|end_header_id|>"
      - "<|eom_id|>"
      - "<|eot_id|>"
      - "<|python_tag|>"
    match_type: contains
    severity: high

  - id: "llama3-reserved-special"
    name: "Llama 3 reserved special tokens"
    tokens:
      - "<\\|reserved_special_token_\\d+\\|>"
    match_type: regex
    severity: medium

  - id: "llama-vision-special"
    name: "Llama vision special tokens"
    tokens:
      - "<|image|>"
      - "<|step_id|>"
    match_type: contains
    severity: high

  - id: "llama4-chat-special"
    name: "Llama 4 chat special tokens"
    tokens:
      - "<|header_start|>"
      - "<|header_end|>"
      - "<|eom|>"
      - "<|eot|>"
      - "<|step|>"
    match_type: contains
    severity: high

  - id: "llama4-fim-special"
    name: "Llama 4 FIM special tokens"
    tokens:
      - "<|fim_prefix|>"
      - "<|fim_middle|>"
      - "<|fim_suffix|>"
    match_type: contains
    severity: high

  - id: "llama4-python-special"
    name: "Llama 4 Python special tokens"
    tokens:
      - "<|python_start|>"
      - "<|python_end|>"
    match_type: contains
    severity: high

  - id: "llama4-vision-special"
    name: "Llama 4 vision special tokens"
    tokens:
      - "<|image_start|>"
      - "<|image_end|>"
      - "<|patch|>"
      - "<|tile_x_separator|>"
      - "<|tile_y_separator|>"
    match_type: contains
    severity: high

  - id: "llama4-text-reserved-special"
    name: "Llama 4 text reserved special tokens"
    tokens:
      - "<\\|text_post_train_reserved_special_token_\\d+\\|>"
    match_type: regex
    severity: medium

  - id: "llama4-vision-reserved-special"
    name: "Llama 4 vision reserved special tokens"
    tokens:
      - "<\\|vision_reserved_special_token_\\d+\\|>"
    match_type: regex
    severity: medium

settings:
  check_request_body: true
  check_request_headers: false
  log_response_body: true
