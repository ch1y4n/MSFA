rules:
  - id: "universal-endoftext"
    name: "Universal end-of-text markers"
    tokens:
      - "<|endoftext|>"
      - "<|endofprompt|>"
    match_type: contains
    severity: critical

settings:
  check_request_body: true
  check_request_headers: false
  log_response_body: true
  report_output: "logs/detections.jsonl"
  provider_validation:
    enabled: false
    mode: "auto"
    async: true
    max_tokens_per_request: 20
