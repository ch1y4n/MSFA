rules:
  - id: "mistral-instruct"
    name: "Mistral instruction template markers"
    tokens:
      - "[INST]"
      - "[/INST]"
    match_type: contains
    severity: high

  - id: "mistral-system-prompt"
    name: "Mistral system prompt markers"
    tokens:
      - "[SYSTEM_PROMPT]"
      - "[/SYSTEM_PROMPT]"
    match_type: contains
    severity: high

  - id: "mistral-tool"
    name: "Mistral tool call markers"
    tokens:
      - "[AVAILABLE_TOOLS]"
      - "[/AVAILABLE_TOOLS]"
      - "[TOOL_CALLS]"
      - "[TOOL_RESULTS]"
      - "[/TOOL_RESULTS]"
      - "[ARGS]"
      - "[CALL_ID]"
      - "[TOOL_CONTENT]"
    match_type: contains
    severity: high

  - id: "mistral-thinking"
    name: "Mistral thinking/reasoning markers"
    tokens:
      - "[THINK]"
      - "[/THINK]"
    match_type: contains
    severity: high

  - id: "mistral-fim"
    name: "Mistral fill-in-the-middle markers"
    tokens:
      - "[PREFIX]"
      - "[MIDDLE]"
      - "[SUFFIX]"
    match_type: contains
    severity: high

  - id: "mistral-multimodal"
    name: "Mistral multimodal media markers"
    tokens:
      - "[IMG]"
      - "[IMG_BREAK]"
      - "[IMG_END]"
      - "[AUDIO]"
      - "[BEGIN_AUDIO]"
    match_type: contains
    severity: high

  - id: "mistral-model-settings"
    name: "Mistral model settings markers"
    tokens:
      - "[MODEL_SETTINGS]"
      - "[/MODEL_SETTINGS]"
    match_type: contains
    severity: medium

  - id: "mistral-reference"
    name: "Mistral reference document markers"
    tokens:
      - "\\[REFERENCE_DOC_(1[0-9]|[0-9])\\]"
    match_type: regex
    severity: medium

settings:
  check_request_body: true
  check_request_headers: false
  log_response_body: true
