rules:
  - id: "glm-boundary-special"
    name: "GLM boundary special tokens"
    tokens:
      - "<|endoftext|>"
      - "[MASK]"
      - "[gMASK]"
      - "[sMASK]"
      - "<sop>"
      - "<eop>"
    match_type: contains
    severity: high

  - id: "glm-chat-special"
    name: "GLM chat role special tokens"
    tokens:
      - "<|system|>"
      - "<|user|>"
      - "<|assistant|>"
      - "<|observation|>"
    match_type: contains
    severity: high

  - id: "glm-media-special"
    name: "GLM media special tokens"
    tokens:
      - "<|begin_of_image|>"
      - "<|end_of_image|>"
      - "<|begin_of_video|>"
      - "<|end_of_video|>"
      - "<|begin_of_audio|>"
      - "<|end_of_audio|>"
      - "<|image|>"
      - "<|video|>"
      - "<|begin_of_box|>"
      - "<|end_of_box|>"
    match_type: contains
    severity: high

  - id: "glm-transcription-special"
    name: "GLM transcription special tokens"
    tokens:
      - "<|begin_of_transcription|>"
      - "<|end_of_transcription|>"
    match_type: contains
    severity: high

  - id: "glm-code-special"
    name: "GLM code special tokens"
    tokens:
      - "<|code_prefix|>"
      - "<|code_middle|>"
      - "<|code_suffix|>"
    match_type: contains
    severity: high

  - id: "glm-thinking-markers"
    name: "GLM reasoning control markers"
    tokens:
      - "<think>"
      - "</think>"
      - "/nothink"
    match_type: contains
    severity: high

  - id: "glm-tool-markers"
    name: "GLM tool control markers"
    tokens:
      - "<tools>"
      - "</tools>"
      - "<tool_call>"
      - "</tool_call>"
      - "<tool_response>"
      - "</tool_response>"
      - "<arg_key>"
      - "</arg_key>"
      - "<arg_value>"
      - "</arg_value>"
    match_type: contains
    severity: high

  - id: "glm-reminder-markers"
    name: "GLM reminder control markers"
    tokens:
      - "<reminder>"
      - "</reminder>"
    match_type: contains
    severity: high

settings:
  check_request_body: true
  check_request_headers: false
  log_response_body: true
