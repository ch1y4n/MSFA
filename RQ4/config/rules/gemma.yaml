rules:
  - id: "gemma-boundary-special"
    name: "Gemma boundary special tokens"
    tokens:
      - "<pad>"
      - "<eos>"
      - "<bos>"
      - "<unk>"
      - "<mask>"
    match_type: contains
    severity: high

  - id: "gemma-turn-channel-special"
    name: "Gemma turn and channel special tokens"
    tokens:
      - "<|turn>"
      - "<turn|>"
      - "<|channel>"
      - "<channel|>"
      - "<|think|>"
      - "<|\"|>"
      - "<start_of_turn>"
      - "<end_of_turn>"
    match_type: contains
    severity: high

  - id: "gemma-tool-special"
    name: "Gemma tool special tokens"
    tokens:
      - "<|tool>"
      - "<tool|>"
      - "<|tool_call>"
      - "<tool_call|>"
      - "<|tool_response>"
      - "<tool_response|>"
    match_type: contains
    severity: high

  - id: "gemma-multimodal-special"
    name: "Gemma multimodal special tokens"
    tokens:
      - "<|image>"
      - "<image|>"
      - "<|image|>"
      - "<start_of_image>"
      - "<end_of_image>"
      - "<image_soft_token>"
      - "<|audio>"
      - "<audio|>"
      - "<|audio|>"
      - "<|video|>"
    match_type: contains
    severity: high

  - id: "gemma-added-control-markers"
    name: "Gemma added control markers"
    description: "Tokenizer added tokens with special=false, still useful as control-marker evidence."
    tokens:
      - "[multimodal]"
    match_type: contains
    severity: medium

settings:
  check_request_body: true
  check_request_headers: false
  log_response_body: true
