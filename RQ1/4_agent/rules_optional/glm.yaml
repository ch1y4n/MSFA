rules:
  - id: "glm-boundary-special"
    name: "GLM boundary special tokens"
    tokens:
      - "[MASK]"
      - "[gMASK]"
      - "[sMASK]"
      - "<sop>"
      - "<eop>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: strong
        match_type: regex
        patterns:
          - '\[(?:gMASK|sMASK|MASK)\]'
          - '<(?:sop|eop)>'
      regex:
        strength: strong
        match_type: regex
        patterns:
          - '\\+\[(?:gMASK|sMASK|MASK)\\+\]'
          - '<\\+/?(?:sop|eop)>'
      partial:
        strength: weak
        match_type: regex
        patterns:
          - '\b(?:gMASK|sMASK)\b'

  - id: "glm-chat-special"
    name: "GLM chat role special tokens"
    tokens:
      - "<|system|>"
      - "<|user|>"
      - "<|assistant|>"
      - "<|observation|>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: strong
        match_type: regex
        patterns:
          - '<\|(?:system|user|assistant|observation)\|>'
      regex:
        strength: strong
        match_type: regex
        patterns:
          - '<\\+\|(?:system|user|assistant|observation)\\+\|>'
          - '<\\+\|[^\n]{0,160}(?:system|user|assistant|observation)[^\n]{0,160}\\+\|>'

  - id: "glm-media-special"
    name: "GLM media special tokens"
    tokens:
      - "<|begin_of_image|>"
      - "<|end_of_image|>"
      - "<|begin_of_video|>"
      - "<|end_of_video|>"
      - "<|begin_of_audio|>"
      - "<|end_of_audio|>"
      - "<|image|>"
      - "<|video|>"
      - "<|begin_of_box|>"
      - "<|end_of_box|>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: strong
        match_type: regex
        patterns:
          - '<\|(?:begin_of_image|end_of_image|begin_of_video|end_of_video|begin_of_audio|end_of_audio|image|video|begin_of_box|end_of_box)\|>'
      regex:
        strength: strong
        match_type: regex
        patterns:
          - '<\\+\|(?:begin_of_image|end_of_image|begin_of_video|end_of_video|begin_of_audio|end_of_audio|image|video|begin_of_box|end_of_box)\\+\|>'
          - '<\\+\|[^\n]{0,160}(?:begin_of_image|end_of_image|begin_of_video|end_of_video|begin_of_audio|end_of_audio|begin_of_box|end_of_box)[^\n]{0,160}\\+\|>'
      partial:
        strength: weak
        match_type: regex
        patterns:
          - '\b(?:begin_of_image|end_of_image|begin_of_video|end_of_video|begin_of_audio|end_of_audio|begin_of_box|end_of_box)\b'

  - id: "glm-transcription-special"
    name: "GLM transcription special tokens"
    tokens:
      - "<|begin_of_transcription|>"
      - "<|end_of_transcription|>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: strong
        match_type: regex
        patterns:
          - '<\|(?:begin_of_transcription|end_of_transcription)\|>'
      regex:
        strength: strong
        match_type: regex
        patterns:
          - '<\\+\|(?:begin_of_transcription|end_of_transcription)\\+\|>'
          - '<\\+\|[^\n]{0,160}(?:begin_of_transcription|end_of_transcription)[^\n]{0,160}\\+\|>'
      partial:
        strength: weak
        match_type: regex
        patterns:
          - '\b(?:begin_of_transcription|end_of_transcription)\b'

  - id: "glm-code-special"
    name: "GLM code special tokens"
    tokens:
      - "<|code_prefix|>"
      - "<|code_middle|>"
      - "<|code_suffix|>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: strong
        match_type: regex
        patterns:
          - '<\|(?:code_prefix|code_middle|code_suffix)\|>'
      regex:
        strength: strong
        match_type: regex
        patterns:
          - '<\\+\|(?:code_prefix|code_middle|code_suffix)\\+\|>'
          - '<\\+\|[^\n]{0,160}(?:code_prefix|code_middle|code_suffix)[^\n]{0,160}\\+\|>'
      partial:
        strength: weak
        match_type: regex
        patterns:
          - '\b(?:code_prefix|code_middle|code_suffix)\b'

  - id: "glm-thinking-markers"
    name: "GLM reasoning control markers"
    tokens:
      - "/nothink"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: medium
        match_type: regex
        patterns:
          - '/nothink'
      regex:
        strength: medium
        match_type: regex
        patterns:
          - '\\/nothink'

  - id: "glm-tool-markers"
    name: "GLM tool control markers"
    tokens:
      - "<tools>"
      - "</tools>"
      - "<arg_key>"
      - "</arg_key>"
      - "<arg_value>"
      - "</arg_value>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: strong
        match_type: regex
        patterns:
          - '</?(?:tools|arg_key|arg_value)>'
      regex:
        strength: strong
        match_type: regex
        patterns:
          - '<\\*/\?(?:tools|arg_key|arg_value)>'

  - id: "glm-reminder-markers"
    name: "GLM reminder control markers"
    tokens:
      - "<reminder>"
      - "</reminder>"
    match_type: contains
    severity: high
    static_patterns:
      literal:
        strength: medium
        match_type: regex
        patterns:
          - '</?reminder>'
      regex:
        strength: medium
        match_type: regex
        patterns:
          - '<\\*/\?reminder>'

settings:
  static_scan:
    match_kinds:
      - literal
      - regex
      - partial
    dedupe:
      same_rule_same_line: true
      priority:
        - regex
        - literal
        - partial
    capture_context_lines: 5
