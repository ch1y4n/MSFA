[project]
name = "guard"
version = "0.1.0"
description = "Prompt-injection evaluation framework: agentdojo base + PromptArmor / MELON / AttriGuard defenses"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
